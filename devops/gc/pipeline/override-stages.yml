variables:
  GC_SERVICE: "oetp-client"
  COLLECTION_PATH: "Postman%20Collection/45_CICD_Reservoir_DDMS/Reservoir%20DDMS%20CI-CD%20v3.0.postman_collection_NotRun.json"
  GC_SUPPORTED_PLATFORM: "linux/amd64"

gc-containerize-gitlab:
  tags: ["osdu-medium"]
  needs: ["compile-and-unit-test"]
  variables:
    BUILD_PATH: "devops/gc/deploy/Dockerfile"
    BUILD_ARGS: "--build-arg DIST=dist.tgz"

gc-containerize-gcr:
  tags: ["osdu-medium"]
  needs: ["compile-and-unit-test"]
  variables:
    BUILD_PATH: "devops/gc/deploy/Dockerfile"
    BUILD_ARGS: "--build-arg DIST=dist.tgz"

gc-containerize-bootstrap-gitlab:
  needs: []

gc-containerize-bootstrap-gcr:
  needs: []

.gc_postman_tests:
  before_script:
    # Auth token
    - >
      curl -sL "https://community.opengroup.org/api/v4/projects/1410/packages/generic/gc_auth_token/master/gc_auth_token"
      -o gc_auth_token && chmod +x gc_auth_token &&
      export GOOGLE_APPLICATION_CREDENTIALS="$GC_INTEGRATION_TESTER_SA_FILE"
    # Install openETPServer + demo data
    - >
      mkdir -p etp-tools &&
      curl -sL "https://community.opengroup.org/osdu/platform/domain-data-mgmt-services/reservoir/open-etp-server/-/archive/main/open-etp-server-main.tar.gz?path=data" |
      tar -xz --strip-components=1 -C etp-tools &&
      curl -sL "https://community.opengroup.org/api/v4/projects/osdu%2Fplatform%2Fdomain-data-mgmt-services%2Freservoir%2Fopen-etp-server/jobs/artifacts/main/raw/build/using_docker/dist.tgz?job=compile-and-unit-test" |
      tar -xz -C etp-tools
    - export PATH="$PWD/etp-tools/bin:$PATH" LD_LIBRARY_PATH="$PWD/etp-tools/lib:${LD_LIBRARY_PATH:-}"
    # Setup ETP client function
    - >
      function oetp_sslclient() {
        openETPServer $* -S wss://${GC_DOMAIN}/api/reservoir-ddms-etp/v2/ \
        --auth bearer \
        --jwt-token ./gc_auth_token \
        --data-partition-id ${GC_TENANT} \
        --log_level=info
      }
    # Setup demo/Volve dataspace
    - oetp_sslclient probe --ping && oetp_sslclient space --list
    - oetp_sslclient space --delete -s demo/Volve || echo "[INFO] No dataspace demo/Volve to cleanup"
    - >
      oetp_sslclient space --new -s demo/Volve &&
      oetp_sslclient space --import-epc ./etp-tools/data/Volve_Demo_Horizons_Depth.epc -s demo/Volve &&
      oetp_sslclient space --list
    # Cleanup
    - rm -rf etp-tools

  script:
    - export GET_COLLECTION_URL="${GC_COLLECTION_HOST}/${GC_COLLECTION_BRANCH}/${COLLECTION_PATH}?inline=false"
    - echo "Get a collection from ${GET_COLLECTION_URL}"
    - >
      if [[ -v TEST_SOURCE_FILES_DIR ]]; then
        wget -q -O tmp.zip "${GC_COLLECTION_ARCHIVE_HOST}/${GC_COLLECTION_BRANCH}/testing-master.zip?path=${TEST_SOURCE_FILES_DIR}" \
        && unzip -j tmp.zip \
        && rm tmp.zip
      fi
    - >
      echo "[{ \"CLIENT_ID\": \"${GC_CLIENT_ID}\", \"CLIENT_SECRET\": \"${GC_CLIENT_SECRET}\", \"grant_type\": \"${GC_GRANT_TYPE}\", \"refresh_token\": \"${GC_REFRESH_TOKEN}\"}]" > test_config_file.json
    - curl "${GET_COLLECTION_URL}" > collection.json && COLLECTION=collection.json
    - |
      curl --header "data-partition-id: ${DATA_PARTITION_ID}" "${GC_POSTMAN_ENV_URL}" > environment.json && ENVIRONMENT=environment.json
    - newman run "$COLLECTION" --working-dir . -e "${ENVIRONMENT}" -d  test_config_file.json --delay-request 3000 || exit $?

# TODO: remove after common gc-test job will be deleted
gc-test:
  tags: ["osdu-small"]
  stage: integration
  image: community.opengroup.org:5555/osdu/platform/deployment-and-operations/base-containers-gcp/image-for-postman-tests/osdu-gcp-image-for-postman
  allow_failure: false
  retry: 1
  extends:
    - .gc-variables
  script:
    - !reference [.gc_postman_tests, script]

gc-acceptance-test:
  image: community.opengroup.org:5555/osdu/platform/deployment-and-operations/base-containers-gcp/image-for-postman-tests/osdu-gcp-image-for-postman
  extends:
    - .gc-variables
  before_script:
    - !reference [.gc_postman_tests, before_script]
  script:
    - !reference [.gc_postman_tests, script]
  rules:
    - if: "$CI_COMMIT_BRANCH =~ /^release/"
      when: never
    - if: "$CI_COMMIT_TAG"
      when: never
    - if: '$GC == "1" && $GC_INT_TEST_TYPE != "python"'
      when: on_success

gc-dev2-test:
  tags: ["osdu-small"]
  stage: integration
  image: community.opengroup.org:5555/osdu/platform/deployment-and-operations/base-containers-gcp/image-for-postman-tests/osdu-gcp-image-for-postman
  allow_failure: false
  retry: 1
  extends:
    - .gc-dev2-variables
  script:
    - !reference [.gc_postman_tests, script]

gc-dev2-acceptance-test:
  image: community.opengroup.org:5555/osdu/platform/deployment-and-operations/base-containers-gcp/image-for-postman-tests/osdu-gcp-image-for-postman
  extends:
    - .gc-dev2-variables
  before_script:
    - !reference [.gc_postman_tests, before_script]
  script:
    - !reference [.gc_postman_tests, script]
