# This template is responsible for using an artifact docker image and pushing it to an ACR.
parameters:
  imageRepoName: ''
  environment: ''
  providerName: ''
  jarFilePath: ''
  artifactName: ''
  dockerFile: ''

steps:
  - task: AzureCLI@1
    displayName: 'Docker Build + ACR Push'
    condition: and(succeeded(), eq('${{ parameters.providerName }}', 'Azure'))
    env:
      BIN_FILE_PATH: ${{ parameters.binFilePath }}
      IMAGE: $(CONTAINER_REGISTRY_NAME).azurecr.io/${{ parameters.imageRepoName }}-${{ parameters.environment }}:$(Build.SourceVersion)
      DOCKERFILE: ${{ parameters.dockerFile }}

    inputs:
      azureSubscription: '$(SERVICE_CONNECTION_NAME)'
      addSpnToEnvironment: true
      scriptLocation: inlineScript
      inlineScript: |
        #!/usr/bin/env bash
        set -euo pipefail

        function writeDockerFile() {
            cat << EOF > Dockerfile
        FROM ubuntu:21.04 as build
        ARG DIST_FILE
        
        COPY \${DIST_FILE}/dist.tgz /tmp/dist.tgz
        
        FROM ubuntu:21.04
        
        ARG VERSION=0.1
        ARG DIST=/source/build/using_docker/dist/
        
        LABEL version="\${VERSION}"
        LABEL vendor="OSDU Reservoir DDMS"
        LABEL description="Open ETP Server Runtime Image"
        
        COPY --from=build /tmp/dist.tgz /tmp/dist.tgz
        RUN tar -xzvf /tmp/dist.tgz -C /usr/ && rm -rf /tmp/dist.tgz
        
        EXPOSE 9002
        
        CMD [ "openETPServer", "server", "--start" , "--authN", "none"]
        EOF

            echo "[INFO] Generated Dockerfile:"
            cat Dockerfile
        }

        curl -L https://aka.ms/acr/installaad/bash | /bin/bash
        echo "Logging in to the ACR Registry"
        echo "------------------------------------"
        az acr login -n $(CONTAINER_REGISTRY_NAME)

        if [[ ! ${DOCKERFILE} ]]; then
          writeDockerFile
        else
          cp -v ${{ parameters.artifactName }}/${DOCKERFILE} Dockerfile
        fi

        bin_file_name=$(basename $BIN_FILE_PATH)
        cp -v $BIN_FILE_PATH .

        echo "Tagging and Pushing $IMAGE to ACR for BIN $bin_file_name from $BIN_FILE_PATH"
        echo "------------------------------------"
        docker build --build-arg DIST_FILE=./$bin_file_name -t $IMAGE .

        docker push $IMAGE
        echo "Show recent tags of repository ${{ parameters.imageRepoName }}"
        az acr repository show-tags -n $(CONTAINER_REGISTRY_NAME) --repository ${{ parameters.imageRepoName }}-${{ parameters.environment }} --top 10 --orderby time_desc
