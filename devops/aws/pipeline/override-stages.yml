include:
  - project: "osdu/platform/ci-cd-pipelines"
    file: "cloud-providers/aws-global-variables.yml"
  - project: "osdu/platform/ci-cd-pipelines"
    file: "cloud-providers/aws-global.yml"

aws-containerize:
  extends:
    - .aws
    - .aws_common_variables
    - .aws_variables
  needs: ["compile-and-unit-test"]
  stage: containerize
  script:
    - docker build --build-arg DIST=dist.tgz -f devops/osdu/docker/Dockerfile.runtime -t $LOCAL_IMAGE_TAG .
    - $(aws ecr get-login --no-include-email --region $AWS_ECR_REGION)
    - docker tag $LOCAL_IMAGE_TAG $AWS_IMAGE_TAG_BASE:$CI_COMMIT_SHA
    - docker tag $LOCAL_IMAGE_TAG $AWS_IMAGE_TAG_BASE:latest
    - docker push $AWS_IMAGE_TAG_BASE:$CI_COMMIT_SHA
    - docker push $AWS_IMAGE_TAG_BASE:latest
  only:
    variables:
      - $AWS == '1'

aws_test:
  image:
    name: node:lts
  tags: ["osdu-medium"]
  extends:
    - .aws_common_variables
    - .aws_variables
  stage: integration
  needs: ["aws-update-tf"]
  variables:
    AWS_COLLECTION_PATH: https://community.opengroup.org/osdu/platform/pre-shipping/-/raw/main/R3-M19/AWS-M19/DDMS%20Reservoir/AWS_OSDUR3M19_ReservoirDDMS_Collection.postman_collection.json
    AWS_COLLECTION_ENV_PATH: https://community.opengroup.org/osdu/qa/-/raw/main/Postman%20Collection/00_CICD_Setup_Environment/aws.OSDU%20R3%20PROD%20v2.4.postman_environment.json
  before_script:
    - apt-get update && apt-get install -y jq
    - |
      curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
      unzip -q awscliv2.zip
      ./aws/install
    - !reference [.aws_variables, before_script]
    - |
      echo "AWS_COGNITO_USER_POOL_ID: $AWS_COGNITO_USER_POOL_ID";
      export AWS_TOKEN_FETCH_URL=$(aws ssm get-parameter --name /osdu/cognito/${COGNITO_NAME}/oauth/token-uri --query Parameter.Value  --output text --region $AWS_REGION);
      export AWS_COGNITO_REFRESH_TOKEN=$(aws cognito-idp initiate-auth --auth-flow ${AWS_COGNITO_AUTH_FLOW} --client-id ${AWS_COGNITO_CLIENT_ID} --auth-parameters USERNAME=${AWS_COGNITO_AUTH_PARAMS_USER},PASSWORD=${AWS_COGNITO_AUTH_PARAMS_PASSWORD} | jq -r '.[].RefreshToken // empty');
      echo $AWS_COGNITO_REFRESH_TOKEN | wc -c
  script:
    - npm install -g newman
    - newman run $AWS_COLLECTION_PATH -e $AWS_COLLECTION_ENV_PATH --env-var "osduonaws_base_url=${AWS_BASE_URL}" --env-var "RESERVOIR_DDMS_HOST=${AWS_BASE_URL}/api/reservoir-ddms/v2" --env-var "Token_Fetch_URL=$AWS_TOKEN_FETCH_URL" --env-var "grant_type=refresh_token" --env-var "refresh_token=${AWS_COGNITO_REFRESH_TOKEN}" --env-var "CLIENT_ID=${AWS_COGNITO_CLIENT_ID}" --env-var "data_partition_id=$DATA_PARTITION_ID"
  only:
    variables:
      - $AWS == '1'
