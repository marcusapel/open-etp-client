variables:
  CIMPL_SERVICE: "oetp-client"
  CIMPL_SUPPORTED_PLATFORM: "linux/amd64"
  DATA_PARTITION_ID: "osdu"
  CIMPL_DNS_NAME: "osdu.$CIMPL_DOMAIN"
  CIMPL_HELM_DEPLOYMENT_DIR: "devops/core-plus/deploy"
  CIMPL_HELM_PACKAGE_NAME: "cimpl-$CIMPL_SERVICE-deploy"

cimpl-containerize-gitlab:
  tags: ["osdu-medium"]
  needs: ["compile-and-unit-test"]
  variables:
    CIMPL_BUILD_PATH: "devops/core-plus/deploy/Dockerfile"
    CIMPL_BUILD_ARGS: "--build-arg DIST=dist.tgz"

cimpl-containerize-bootstrap-gitlab:
  needs: []

.cimpl_postman_tests:
  script:
    - export GET_COLLECTION_URL="${CIMPL_COLLECTION_HOST}/${CIMPL_COLLECTION_BRANCH}/${COLLECTION_PATH}?inline=false"
    - echo "Get a collection from ${GET_COLLECTION_URL}"
    - >
      if [[ -v TEST_SOURCE_FILES_DIR ]]; then
        wget -q -O tmp.zip "${CIMPL_COLLECTION_ARCHIVE_HOST}/${CIMPL_COLLECTION_BRANCH}/testing-master.zip?path=${TEST_SOURCE_FILES_DIR}" \
        && unzip -j tmp.zip \
        && rm tmp.zip
      fi
    - >
      echo "[{ \"CLIENT_ID\": \"${CIMPL_CLIENT_ID}\", \"CLIENT_SECRET\": \"${CIMPL_CLIENT_SECRET}\", \"grant_type\": \"${CIMPL_GRANT_TYPE}\", \"refresh_token\": \"${CIMPL_REFRESH_TOKEN}\"}]" > test_config_file.json
    - curl "${GET_COLLECTION_URL}" > collection.json && COLLECTION=collection.json
    - |
      curl --header "data-partition-id: ${DATA_PARTITION_ID}" "${CIMPL_POSTMAN_ENV_URL}" > environment.json && ENVIRONMENT=environment.json
    # Create the RDDMS legal tag before running the collection (mirrors ADO RDDMS.Server.Test
    # which calls IntegrationTests/CreateLegalTag.yml). The v3.1 collection self-seeds its own
    # dataspace, but dataspace creation requires a pre-existing legal tag in the partition.
    # Token is acquired via the same refresh_token grant the postman "Refresh Tokens" request uses.
    - |
      TOKEN_FETCH_URL="https://keycloak.${CIMPL_DOMAIN}/realms/osdu/protocol/openid-connect/token"
      ACCESS_TOKEN=$(curl -s -X POST "${TOKEN_FETCH_URL}" \
        -H "Content-Type: application/x-www-form-urlencoded" \
        -d "grant_type=${CIMPL_GRANT_TYPE}" \
        -d "client_id=${CIMPL_CLIENT_ID}" \
        -d "client_secret=${CIMPL_CLIENT_SECRET}" \
        -d "refresh_token=${CIMPL_REFRESH_TOKEN}" \
        | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')
      if [ -z "${ACCESS_TOKEN}" ]; then echo "Failed to fetch access token"; exit 1; fi
      LEGAL_TAG_NAME="${DATA_PARTITION_ID}-RDDMS-Legal-Tag"
      # Use node (already required for newman) to compute the expiry date portably.
      # The runner image lacks both GNU date and python3.
      EXPIRY=$(node -e "const d=new Date();d.setUTCDate(d.getUTCDate()+30);console.log(d.toISOString().slice(0,10))")
      LEGAL_TAG_BODY="{\"name\":\"${LEGAL_TAG_NAME}\",\"description\":\"RDDMS CI legal tag\",\"properties\":{\"contractId\":\"123456\",\"countryOfOrigin\":[\"US\",\"CA\"],\"dataType\":\"Third Party Data\",\"exportClassification\":\"EAR99\",\"originator\":\"Schlumberger\",\"personalData\":\"No Personal Data\",\"securityClassification\":\"Private\",\"expirationDate\":\"${EXPIRY}\"}}"
      LEGAL_TAG_STATUS=$(curl -s -o /tmp/legaltag.out -w "%{http_code}" -X POST "https://${CIMPL_DNS_NAME}/api/legal/v1/legaltags" \
        -H "Content-Type: application/json" \
        -H "Authorization: Bearer ${ACCESS_TOKEN}" \
        -H "data-partition-id: ${DATA_PARTITION_ID}" \
        -d "${LEGAL_TAG_BODY}")
      echo "Legal tag '${LEGAL_TAG_NAME}' create status: ${LEGAL_TAG_STATUS}"
      cat /tmp/legaltag.out || true; echo
      if [ "${LEGAL_TAG_STATUS}" != "201" ] && [ "${LEGAL_TAG_STATUS}" != "409" ]; then
        echo "Legal tag creation failed (expected 201 or 409)"; exit 1;
      fi
    - newman run "$COLLECTION" --working-dir . -e "${ENVIRONMENT}" -d  test_config_file.json --delay-request 3000 --env-var TENANT_ID=${CIMPL_TENANT} --env-var HOSTNAME=${CIMPL_DNS_NAME} --env-var RESERVOIR_DDMS_HOST=${CIMPL_DNS_NAME}/api/reservoir-ddms/v2 --env-var Token_Fetch_URL=https://keycloak.${CIMPL_DOMAIN}/realms/osdu/protocol/openid-connect/token --env-var ENTITLEMENTS_DOMAIN=contoso.com || exit $?

cimpl-test:
  tags: ["osdu-small"]
  stage: integration
  image: community.opengroup.org:5555/osdu/platform/deployment-and-operations/base-containers-cimpl/image-for-postman-tests/osdu-cimpl-image-for-postman:df5a6d3c
  allow_failure: false
  retry: 1
  extends:
    - .cimpl-variables
  variables:
    # Override values pulled in from .cimpl-variables (job-level wins over template-level).
    COLLECTION_PATH: "Postman%20Collection/45_CICD_Reservoir_DDMS/Reservoir%20DDMS%20CI-CD%20v3.1.postman_collection.json"
    # Pin to qa MR branch until osdu/qa!175 merges, then revert to default (main).
    CIMPL_COLLECTION_BRANCH: "risbansal/reservoir-ddms-ci-cd-v3.1"
  script:
    - !reference [.cimpl_postman_tests, script]

cimpl-acceptance-test:
  extends:
    - .cimpl-variables

# dev2

cimpl-dev2-test:
  tags: ["osdu-small"]
  stage: integration
  image: community.opengroup.org:5555/osdu/platform/deployment-and-operations/base-containers-cimpl/image-for-postman-tests/osdu-cimpl-image-for-postman:df5a6d3c
  allow_failure: false
  retry: 1
  extends:
    - .cimpl-dev2-variables
  variables:
    # Override values pulled in from .cimpl-dev2-variables (job-level wins over template-level).
    COLLECTION_PATH: "Postman%20Collection/45_CICD_Reservoir_DDMS/Reservoir%20DDMS%20CI-CD%20v3.1.postman_collection.json"
    # Pin to qa MR branch until osdu/qa!175 merges, then revert to default (main).
    CIMPL_COLLECTION_BRANCH: "risbansal/reservoir-ddms-ci-cd-v3.1"
  script:
    - !reference [.cimpl_postman_tests, script]

cimpl-dev2-acceptance-test:
  extends:
    - .cimpl-dev2-variables

cimpl-dev2-acceptance-test-python:
  extends:
    - .cimpl-dev2-variables
