azure_containerize:
  stage: containerize
  extends: [ .acr_push ]
  needs:
    - job: get_azure_epmosdu_env
      artifacts: true
    - job: npm_build
      artifacts: true
  variables:
    DOCKERFILE_PATH: $CI_PROJECT_DIR/devops/osdu/docker/Dockerfile.runtime
    DOCKERFILE_CONTEXT: $CI_PROJECT_DIR
    AZURE_ACR: $AZURE_REGISTRY.azurecr.io
    AZURE_DOCKER_IMAGE_NAME: $CI_PROJECT_NAME
    AZURE_DOCKER_IMAGE_TAG: $CI_COMMIT_SHORT_SHA

# Removing test stage and part
npm_build:
  stage: build
  image: node:14-alpine
  only:
    changes:
      - devops/**/*
      - src/**/*
      - .gitlab-ci.yml
    refs:
      - branches
      - main
      - merge_requests
  script:
    - apk update && apk upgrade && apk add --no-cache python3 && ln -sf python3 /usr/bin/python
    - apk add --update make g++ nodejs npm git
    - npm install
    - npm run build
    - tar -czf dist.tgz dist node_modules package*
    - du -sh dist.tgz
  artifacts:
    paths:
      - dist.tgz 

# Spliting test from build
rdms_rest_compile-and-unit-test:
  stage: coverage
  allow_failure: true
